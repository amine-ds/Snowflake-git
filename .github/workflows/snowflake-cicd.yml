name: Snowflake CI/CD

# Se déclenche dès qu'une Pull Request est ouverte ou mise à jour vers main.
# Le job "lint" tourne automatiquement. Les jobs de déploiement sont bloqués
# par les règles de protection des GitHub Environments "preprod" et "prod"
# (reviewers obligatoires = équipe Snowflake admin), configurées dans
# Settings > Environments du repo (voir README.md).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "sql/**/*.sql"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: snowflake-cicd-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lister les fichiers SQL modifiés
        id: changed
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          # git diff renvoie un fichier par ligne ; on les joint par des
          # espaces pour obtenir UNE seule ligne, sans quoi chaque fichier
          # supplémentaire serait injecté comme une commande shell séparée
          # dans l'étape qui consomme cette sortie (cf. incident constaté :
          # "sql/xxx.sql: Permission denied", exit code 126).
          files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'sql/**/*.sql' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Fichiers modifiés : $files"

      - name: Lint
        if: steps.changed.outputs.files != ''
        run: |
          python scripts/lint_sql.py ${{ steps.changed.outputs.files }}

  deploy-preprod:
    name: Déploiement PREPROD (validation Snowflake admin requise)
    needs: lint
    runs-on: ubuntu-latest
    environment: preprod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r scripts/requirements.txt

      - name: Lister les fichiers SQL modifiés
        id: changed
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'sql/**/*.sql' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Fichiers modifiés : $files"

      - name: Déploiement sur Snowflake PREPROD
        if: steps.changed.outputs.files != ''
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          TARGET_ENV: PPR
        run: |
          python scripts/deploy_snowflake.py ${{ steps.changed.outputs.files }}

  deploy-prod:
    name: Déploiement PROD (validation Snowflake admin requise)
    needs: deploy-preprod
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r scripts/requirements.txt

      - name: Lister les fichiers SQL modifiés
        id: changed
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'sql/**/*.sql' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Fichiers modifiés : $files"

      - name: Déploiement sur Snowflake PROD
        if: steps.changed.outputs.files != ''
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          TARGET_ENV: PRD
        run: |
          python scripts/deploy_snowflake.py ${{ steps.changed.outputs.files }}
