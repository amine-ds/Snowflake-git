name: Snowflake CI/CD (caller)

# Workflow "appelant" : la logique de lint + déploiement (scripts, étapes)
# vit dans le dépôt amine-ds/snowflake-admin, invoquée ici à chaque PR vers
# QUAL ou PRD via un reusable workflow. Les Environments GitHub (qual, prod)
# et leurs secrets Snowflake vivent en revanche ICI, dans ce dépôt (voir
# README section 5) : c'est ce dépôt qui possède les données qu'il déploie,
# donc les accès et les validations. C'est pourquoi le job `deploy`
# ci-dessous porte lui-même `environment:` et `secrets: inherit`, pour
# transmettre les secrets de l'Environment actif jusqu'au workflow
# réutilisable.
#
# Rappel du modèle : une branche de ticket est créée depuis PRD, mergée
# dans DEV (aucune pipeline), puis une PR vers QUAL (lint + déploiement
# auto sur QUA), puis une PR vers PRD (lint + déploiement sur PRD, avec
# validation manuelle).

on:
  pull_request:
    branches: [QUAL, PRD]
    types: [opened, synchronize, reopened]
    paths:
      - "sql/**/*.sql"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: snowflake-cicd-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  determine-target:
    name: Déterminer l'environnement cible
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.set.outputs.target_env }}
      environment_name: ${{ steps.set.outputs.environment_name }}
    steps:
      - id: set
        run: |
          if [ "${{ github.base_ref }}" = "PRD" ]; then
            echo "target_env=PRD" >> "$GITHUB_OUTPUT"
            echo "environment_name=prod" >> "$GITHUB_OUTPUT"
          else
            echo "target_env=QUA" >> "$GITHUB_OUTPUT"
            echo "environment_name=qual" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Lint + déploiement (snowflake-admin)
    needs: determine-target
    environment: ${{ needs.determine-target.outputs.environment_name }}
    uses: amine-ds/snowflake-admin/.github/workflows/snowflake-deploy.yml@main
    secrets: inherit
    with:
      target_env: ${{ needs.determine-target.outputs.target_env }}
